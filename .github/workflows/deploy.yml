# main에 푸시하면 Cloudflare Workers(mauvelabs-site)로 배포한다(2026-10-12 · 홈페이지는 Workers에서 나간다).
# 토큰은 저장소 시크릿 CLOUDFLARE_API_TOKEN(Workers 배포 권한만) — 없으면 배포 단계를 건너뛴다.
name: Deploy to Cloudflare Workers
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 9c8bfa7b3a161a869b82e939d2c5a252
          wranglerVersion: '4.149.0'
      - name: Skip (no token)
        if: env.HAS_TOKEN != 'true'
        run: echo "CLOUDFLARE_API_TOKEN 시크릿이 없어 배포를 건너뛴다"
